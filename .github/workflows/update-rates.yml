
name: Update exchange rates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch exchange rates
        run: |
          pip install requests beautifulsoup4 pandas lxml
          python - <<'PY'
          import requests, pandas as pd, json, io
          from bs4 import BeautifulSoup

          url = "https://yeces.com/exchange-rates-yemen/"
          r = requests.get(url, timeout=30, headers={
              "User-Agent": "Mozilla/5.0"
          })
          r.raise_for_status()

          tables = pd.read_html(io.StringIO(r.text))
          if not tables:
              raise RuntimeError("No exchange-rate table found")

          df = max(tables, key=len)
          result = {
              "source": url,
              "updated_at": pd.Timestamp.utcnow().isoformat(),
              "data": df.fillna("").to_dict(orient="records")
          }

          if len(result["data"]) == 0:
              raise RuntimeError("No rates found")

          with open("rates.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("Rates saved:", len(result["data"]))
          PY

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update exchange rates"
          git push
